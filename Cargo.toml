[package]
name = "trch"
version = "0.1.0"
edition = "2024"

[lib]
name = "trch_lib"
# Tauri's recommended crate types so the app logic lives in a lib the bin re-exports.
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }

[profile.release]
strip = true
