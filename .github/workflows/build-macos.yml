name: build-macos

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same ref
# (saves the 10x-billed macOS minutes).
concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to attach the .dmg to a Release on v* tags

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon runner; cross-compiles x86_64 for the universal build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (both macOS targets for a universal binary)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          bun install
          bun install --cwd frontend

      # tauri build runs the frontend `beforeBuildCommand` (vite build) itself,
      # then bundles a universal .app + .dmg. The crate lives at the repo root,
      # so the bundles land under target/universal-apple-darwin/release/bundle.
      - name: Build TrchSync (universal macOS)
        run: bunx tauri build --target universal-apple-darwin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrchSync-macos-universal
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

      # Rolling pre-release refreshed on every push to main / manual run: the latest
      # universal .dmg is always downloadable from the "nightly" release (tag is moved
      # to the current commit and old assets are replaced).
      - name: Publish rolling "nightly" release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (latest main)" \
            --notes "Automated universal macOS build from ${GITHUB_SHA:0:7}. Unsigned: mount the .dmg, then right-click the app and choose Open (or run: xattr -cr /Applications/TrchSync.app)." \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg

      # Permanent versioned release for git tags (git tag v0.1.0 && git push --tags).
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Universal macOS build. Unsigned: mount the .dmg, then right-click the app and choose Open (or run: xattr -cr /Applications/TrchSync.app)." \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg \
          || gh release upload "$GITHUB_REF_NAME" target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
